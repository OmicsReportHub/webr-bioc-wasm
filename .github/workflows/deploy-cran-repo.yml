# Workflow derived from https://github.com/r-wasm/actions/tree/v2/examples
# It reads ./packages and deploys a CRAN-like R WebAssembly package repository to GitHub Pages.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

name: Build and deploy wasm R package repository

jobs:
  deploy-cran-repo:
    runs-on: ubuntu-22.04

    concurrency:
      group: github-pages
      cancel-in-progress: true

    permissions:
      contents: read
      # To download GitHub Packages within action
      repository-projects: read
      # For publishing to pages environment
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4

      - name: Checkout r-wasm/actions repository
        uses: actions/checkout@v4
        with:
          ref: v2
          repository: r-wasm/actions
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .actions

      - name: Retrieve packages from `./packages` file
        id: packages-file
        shell: Rscript {0}
        run: |
          if (!file.exists("./packages")) {
            stop("`./packages` file not found")
          }
          pkgs <- unique(trimws(readLines("./packages", warn = FALSE)))
          pkgs <- pkgs[nzchar(pkgs) & !startsWith(pkgs, "#")]
          cat("pkgs=", paste0(pkgs, collapse = ","), "\n", file = Sys.getenv("GITHUB_OUTPUT"), sep = "", append = TRUE)

      - name: Patch r-wasm package resolver workaround
        shell: python
        run: |
          from pathlib import Path

          # Work around r-wasm/rwasm#56 by skipping the built-in webR remotes
          # resolver. None of this repository's starter packages need those
          # source overrides.
          path = Path(".actions/build-rwasm/code.R")
          text = path.read_text()
          old = 'rwasm::add_pkg(packages, repo_dir = repo_path, compress = compress)'
          new = 'rwasm::add_pkg(packages, repo_dir = repo_path, remotes = NULL, compress = compress)'
          if old not in text:
              raise SystemExit("Expected rwasm::add_pkg() call was not found")
          path.write_text(text.replace(old, new))

      - name: Build wasm repo
        uses: ./.actions/build-rwasm
        with:
          packages: ${{ steps.packages-file.outputs.pkgs }}
          repo-path: _site
          webr-image: ghcr.io/r-wasm/webr:main
          compress: false

      - name: Generate Pages index
        shell: Rscript {0}
        run: |
          escape_html <- function(x) {
            x <- gsub("&", "&amp;", x, fixed = TRUE)
            x <- gsub("<", "&lt;", x, fixed = TRUE)
            x <- gsub(">", "&gt;", x, fixed = TRUE)
            x <- gsub('"', "&quot;", x, fixed = TRUE)
            x
          }

          repo <- strsplit(Sys.getenv("GITHUB_REPOSITORY"), "/", fixed = TRUE)[[1]]
          site_url <- sprintf("https://%s.github.io/%s/", tolower(repo[[1]]), repo[[2]])

          package_refs <- unique(trimws(readLines("packages", warn = FALSE)))
          package_refs <- package_refs[nzchar(package_refs) & !startsWith(package_refs, "#")]

          package_index <- file.path("_site", "bin", "emscripten", "contrib")
          r_versions <- if (dir.exists(package_index)) {
            basename(list.dirs(package_index, recursive = FALSE, full.names = TRUE))
          } else {
            character()
          }

          version_links <- if (length(r_versions)) {
            paste0(
              "<li><a href=\"bin/emscripten/contrib/", escape_html(r_versions),
              "/PACKAGES\">R ", escape_html(r_versions), " binary package index</a></li>",
              collapse = "\n"
            )
          } else {
            "<li>No binary package index was generated.</li>"
          }

          package_items <- paste0("<li><code>", escape_html(package_refs), "</code></li>", collapse = "\n")

          html <- c(
            "<!doctype html>",
            "<html lang=\"en\">",
            "<head>",
            "  <meta charset=\"utf-8\">",
            "  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">",
            "  <title>webR Bioconductor Wasm Packages</title>",
            "  <style>",
            "    body { max-width: 760px; margin: 3rem auto; padding: 0 1.25rem; font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1f2933; }",
            "    h1 { font-size: 2rem; line-height: 1.15; margin-bottom: 0.5rem; }",
            "    h2 { margin-top: 2rem; font-size: 1.2rem; }",
            "    code { background: #f3f4f6; padding: 0.1rem 0.25rem; border-radius: 4px; }",
            "    pre { overflow-x: auto; background: #f3f4f6; padding: 1rem; border-radius: 6px; }",
            "    a { color: #075985; }",
            "  </style>",
            "</head>",
            "<body>",
            "  <h1>webR Bioconductor Wasm Packages</h1>",
            "  <p>This GitHub Pages site hosts a webR-compatible R package repository.</p>",
            "  <h2>Repository URL</h2>",
            sprintf("  <pre><code>%s</code></pre>", escape_html(site_url)),
            "  <h2>Built Packages</h2>",
            sprintf("  <ul>%s</ul>", package_items),
            "  <h2>Package Indexes</h2>",
            sprintf("  <ul>%s</ul>", version_links),
            "</body>",
            "</html>"
          )

          writeLines(html, file.path("_site", "index.html"))
          writeLines("", file.path("_site", ".nojekyll"))

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
